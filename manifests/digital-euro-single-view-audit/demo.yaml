id: digital-euro-single-view-audit
slug: digital-euro-single-view-audit
title: Digital Euro Single View Audit
tagline: Operational single view and audit layer for digital euro events.
summary: MongoDB as an operational single view and audit layer for digital euro events. A simulator publishes to five
  Kafka topics; events land in five MongoDB collections and are correlated in near real time into customer journeys,
  state transitions, notifications, failures and reconciliation views.
businessProblem: Digital currency onboarding involves many systems emitting events about the same customer. Without a
  correlated view, operations cannot answer "where is this customer in their journey?" or explain failures, and
  reconciliation across systems is slow.
solution: Events from each topic are stored in dedicated MongoDB collections and correlated by customer and journey
  identifiers to reconstruct state transitions, detect failures and support reconciliation and audit queries.
industry: Financial Services
category: Event-Driven Architecture
useCases:
  - Single view
  - Audit
  - Event correlation
  - Reconciliation
